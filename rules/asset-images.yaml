        match: 'FOLDERID_Desktop/**'
        verdict: review
  - id: junk.resource_png
    scope: user
    match: '<UserProfile>/**/resource*/**/*.png'
    verdict: ignore
    source: 'real-world backup test'
    note: 'App image resources under a resource folder in the profile. Kept under the user document/media folders (exceptions).'
