        verdict: review
      - id: junk.asset_ico.pictures
        match: 'FOLDERID_Pictures/**'
        verdict: review
      - id: junk.asset_ico.downloads
        match: 'FOLDERID_Downloads/**'
        verdict: review
      - id: junk.asset_ico.desktop
        match: 'FOLDERID_Desktop/**'
        verdict: review
  - id: junk.asset_svg
    scope: user
    match: '<UserProfile>/**/asset*/**/*.svg'
    verdict: ignore
    source: 'real-world backup test'
    exceptions:
      - id: junk.asset_svg.documents
        match: 'FOLDERID_Documents/**'
        verdict: review
      - id: junk.asset_svg.pictures
        match: 'FOLDERID_Pictures/**'
        verdict: review
      - id: junk.asset_svg.downloads
        match: 'FOLDERID_Downloads/**'
        verdict: review
