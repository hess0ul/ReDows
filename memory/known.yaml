# ReDows folder memory — well-known folders/apps it recognises, with a colour and a human note.
# Mémoire de dossiers de ReDows — dossiers/apps connus, avec une couleur et une note.
#
# match: a folder-NAME segment (case-insensitive glob '*'/'?'), locale-safe — never an absolute path.
# importance (optional): keep | maybe | drop — overrides the scan verdict when the memory is confident.
# note: 2-3 sentences shown to the user. (English UI; FR localisation is a later step.)
# The MOST SPECIFIC match wins (deepest path segment), so "…\AppData\Local\Discord" reads as Discord.

schema_version: 1

known:
  - match: AppData
    importance: maybe
    scope: self
    note: >
      Your user's AppData folder. It holds most apps' settings AND their throwaway caches: the Roaming
      part is usually worth keeping (settings, profiles), while Local is mostly re-buildable cache. Each
      app's folder inside is judged on its own.

  - match: Roaming
    importance: keep
    scope: self
    note: >
      The "Roaming" side of AppData. Apps store their settings and profiles here, and it is meant to
      follow you between machines — usually worth keeping; each app's folder is judged on its own.

  - match: LocalLow
    importance: maybe
    scope: self
    note: >
      AppData\LocalLow — low-integrity app data (some games, browser plug-ins). A mix of small settings
      and re-buildable data; usually low value, worth a glance.

  - match: Temp
    importance: drop
    note: >
      A temporary folder. Everything here is scratch data that apps and Windows recreate as needed —
      safe to drop.

  - match: Cache
    importance: drop
    note: >
      An app cache. It speeds the app up but is rebuilt automatically, so nothing here is worth keeping.

  - match: node_modules
    importance: drop
    note: >
      A project's downloaded dependencies. One command with the package manager rebuilds them exactly,
      so it is safe to drop — your source code stays untouched.

  - match: __pycache__
    importance: drop
    note: >
      Compiled Python bytecode. It is regenerated automatically the next time the code runs — safe to drop.

  - match: .git
    importance: keep
    note: >
      A Git repository's full history — every committed version of the project. Keep it, unless the repo
      is safely pushed to a remote you trust (then it can be re-cloned).

  - match: Downloads
    importance: maybe
    scope: self
    note: >
      Your Downloads folder — a mix of installers you can fetch again and files you actually want to keep.
      Worth a look rather than an automatic keep or drop; each item is judged on its own.

  - match: Documents
    importance: keep
    scope: self
    note: >
      Your Documents folder — mostly personal files you created, but some apps and games also keep their
      data in here. Files you made are worth keeping; the app/game subfolders inside are judged on their own.

  # Game/app folders that LIVE inside Documents — created by the game, not by you. The game re-installs,
  # so this is "review": the saves inside are worth keeping, the rest (logs, configs, replays) is not.
  - match: My Games
    importance: maybe
    note: >
      A folder games create inside Documents to store their data. Not personal files you made — the game
      recreates it on reinstall. Worth a look: keep the saves inside, the rest is re-buildable.

  - match: Assetto Corsa
    importance: maybe
    note: >
      Assetto Corsa's data folder (made by the game, not by you). Keep your saves, setups and custom
      content; the logs, caches and replays are re-buildable.

  - match: Need For Speed*
    importance: maybe
    note: >
      A Need for Speed data folder (made by the game). Keep the save/profile; the rest is re-buildable.

  - match: Rockstar Games
    importance: maybe
    note: >
      Rockstar Games' data folder (made by the launcher/games). Keep your saves and profiles; settings and
      logs are re-buildable.

  # Common app folders that apps create inside Documents (not made by you). Review, not "personal":
  # keep what YOU exported/created inside, the app itself recreates the rest on reinstall.
  - match: Adobe
    importance: maybe
    note: >
      An Adobe apps data folder (Photoshop, Premiere…) created by the software. Keep your own exports and
      presets; the caches and app settings are re-buildable.

  - match: ShareX
    importance: maybe
    note: >
      ShareX's data folder, made by the app. Keep the screenshots/captures you want; the app's settings and
      history are re-buildable.

  - match: Image-Line
    importance: maybe
    note: >
      FL Studio / Image-Line data, made by the app. Keep your projects and custom presets; the rest is re-buildable.

  - match: PowerToys
    importance: maybe
    note: >
      PowerToys settings/data, made by the app. Re-created when you reinstall PowerToys — a look, not a keep.

  - match: OneNote Notebooks
    importance: keep
    note: >
      Your OneNote notebooks — notes you wrote. Worth keeping (also usually synced to your Microsoft account).

  - match: Visual Studio*
    importance: maybe
    note: >
      Visual Studio's per-user folder (made by the IDE). Keep your own templates/snippets; settings and the
      rest are re-buildable.

  - match: Electronic Arts
    importance: maybe
    note: >
      Electronic Arts / EA games data, made by the games. Keep your saves; the rest is re-downloadable.

  - match: Ubisoft
    importance: maybe
    note: >
      Ubisoft games data, made by the launcher/games. Keep your saves; the rest is re-downloadable.

  - match: Pictures
    importance: keep
    note: >
      Your Pictures folder — photos and images. Personal memories: keep.

  - match: Videos
    importance: keep
    note: >
      Your Videos folder — personal recordings and clips. Usually worth keeping.

  - match: Saved Games
    importance: keep
    note: >
      The Windows "Saved Games" folder — game save files. Hard or impossible to get back after a reset,
      so keep them.

  - match: OneDrive*
    importance: maybe
    note: >
      A OneDrive folder — its files are (or can be) stored in the cloud. If everything is fully synced you
      can drop the local copy, but check it is uploaded first so nothing is lost.

  - match: Dropbox
    importance: maybe
    note: >
      A Dropbox folder synced to the cloud. If it is fully synced you can drop the local copy — confirm the
      upload first.

  - match: Google Drive*
    importance: maybe
    note: >
      A Google Drive folder synced to the cloud. If it is fully synced you can drop the local copy — confirm
      the upload first.

  - match: steamapps
    importance: drop
    note: >
      Steam's installed games and shader caches. All re-downloadable from your Steam account, so safe to
      drop — your saves live elsewhere (Steam Cloud, and the "userdata" folder).

  - match: userdata
    importance: keep
    note: >
      Steam's per-user data, including your cloud saves (inside the "remote" folders) and game configs.
      Worth keeping the saves; the rest is re-buildable.

  - match: User Data
    importance: keep
    note: >
      A Chromium browser profile (Chrome, Edge or Brave). It holds your bookmarks, settings and saved
      logins. Keep it — and note the saved passwords are encrypted, so export them BEFORE a reset.

  - match: .ssh
    importance: keep
    note: >
      Your SSH keys and known hosts — these are credentials. Keep them, guard them, and never share them.

  - match: Windows.old
    importance: drop
    note: >
      A backup of your previous Windows install, kept after a big update. It is huge and only useful to
      roll back — safe to drop once you are happy with the current Windows.

  - match: $Recycle.Bin
    importance: drop
    note: >
      The Recycle Bin — files you already deleted. Safe to drop.

  - match: Crashpad
    importance: drop
    note: >
      Crash reports an app collected about itself. Diagnostic only — safe to drop.

  - match: .nuget
    importance: drop
    note: >
      The NuGet package cache (.NET libraries). Re-downloaded automatically when a project builds — safe to drop.
