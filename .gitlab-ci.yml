include:
  - project: 'homelab/ci-templates'
    file: '/leak-audit.yml'
    ref: main
  - project: 'homelab/ci-templates'
    file: '/github-feedback.yml'
    ref: main
  - project: 'homelab/ci-templates'
    file: '/windows-runner-power.yml'
    ref: main
  # The GitHub Release job lives in a template: this file is public (mirrored), and the
  # Vault address, KV path and role name have no reason to be. The build below, however,
  # is deliberately public — anyone can check how the released binary is produced.
  - project: 'homelab/ci-templates'
    file: '/github-release.yml'
    ref: main
  # Authenticode signing, pulled into package:windows below. Also a template, for the
  # same reason: the build belongs in public, the Vault plumbing does not.
  - project: 'homelab/ci-templates'
    file: '/sign-windows.yml'
    ref: main

# `stages:` is REPLACED, not merged, across includes. Declaring the full list here (the
# project file wins over every include) is what keeps one include from wiping another's.
stages:
  - audit
  - feedback
  - prepare
  - package
  - release
  - cleanup

variables:
  # The public GitHub repo this project is mirrored to. Public information — it IS this
  # repository's own identity — unlike GL_TARGET_PROJECT, which names the internal GitLab
  # layout and therefore stays on the pipeline schedule (this file is public on github.com).
  GH_REPO: "hess0ul/ReDows"
  PKG_REGISTRY_NAME: "redows"
  # Where French is functional data rather than a stray comment: the prescreen and memory
  # rules match file names in BOTH languages, so the accented patterns there are the
  # feature, not a slip. Everything else is scanned, YAML ruleset included.
  LEAK_FR_EXCLUDE: ":!*/data/* :!data/* :!prescreen/* :!memory/*"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Deterministic and content-based: on unchanged files the verdict cannot differ, so
# re-running it daily would be a no-op. Keep the scheduled pipeline about one thing.
leak-audit:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# ===========================================================================
# PUBLIC RELEASE (tag pipelines only)
# The binary is rebuilt HERE, from the public sources, never copied from the private
# build — that is what makes it verifiable by anyone reading this repository.
# ===========================================================================

# The shared template boots the VM on tags AND on the default branch; here we only ever
# want it for a release, otherwise the daily feedback schedule would power on a build VM
# for nothing. Gated behind leak-audit: never build a public artifact we would refuse to
# publish anyway.
start-windows-runner:
  needs: [leak-audit]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

stop-windows-runner:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

package:windows:
  # extends brings the Vault id_token the signing step needs; the step itself is
  # referenced below, between staging and zipping.
  extends: .sign-windows
  stage: package
  tags: [windows]
  interruptible: false
  needs: [leak-audit, start-windows-runner]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $tag   = $env:CI_COMMIT_TAG
      $ver   = $tag -replace '^v',''
      $pkg   = "ReDows-$tag-win-x64"
      $dist  = 'dist'
      $stage = Join-Path $dist $pkg

      # CLEAN publish, always: incremental builds do not reliably recopy the Content data
      # folders, and shipping a stale ruleset is worse than failing the build.
      if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
      New-Item -ItemType Directory -Path $stage | Out-Null

      foreach ($proj in 'src\ReDows.Cli\ReDows.Cli.csproj', 'src\ReDows.Gui\ReDows.Gui.csproj') {
        $name = [IO.Path]::GetFileNameWithoutExtension($proj)
        $out  = Join-Path $dist "_pub\$name"
        dotnet publish $proj -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:Version=$ver -o $out
        if ($LASTEXITCODE -ne 0) { throw "publish failed: $proj" }
        Copy-Item (Join-Path $out '*') $stage -Recurse -Force
      }

      # Data folders come from git, not from the build output: the CLI never copies them
      # (only the GUI declares them as Content) and everything is resolved next to the exe
      # at runtime, so all six must ship.
      foreach ($d in 'rules','modules','prescreen','memory','settings','secrets') {
        $dst = Join-Path $stage $d
        if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
        Copy-Item -Recurse -Force $d $dst
      }
      Copy-Item 'README.md' $stage -Force
      Get-ChildItem $stage -Filter '*.pdb' -Recurse | Remove-Item -Force
    # Sign BEFORE zipping — signing after would leave the archive holding unsigned
    # binaries, and the SHA256 below must cover the artifact as shipped.
    - !reference [.sign-windows, script]
    - |
      $ErrorActionPreference = 'Stop'
      $zip = Join-Path $dist "$pkg.zip"
      Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
      $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
      "$sha  $pkg.zip" | Out-File -Encoding ascii (Join-Path $dist "$pkg.zip.sha256")
      Write-Host "SHA256 $sha"

      # Park it in the GitLab package registry: ~140 MB is past the job-artifact limit,
      # and the release job then pulls it back over the LAN instead of the WAN.
      # --http1.1 because NPMplus advertises `Upgrade: h2,h2c` over HTTP/2 and curl rejects it.
      $base = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/redows/$ver"
      foreach ($f in @($zip, (Join-Path $dist "$pkg.zip.sha256"))) {
        $leaf = Split-Path $f -Leaf
        curl.exe --fail --silent --show-error --http1.1 `
          --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $f "$base/$leaf"
        if ($LASTEXITCODE -ne 0) { throw "upload failed: $leaf" }
        Write-Host "uploaded $leaf"
      }

      @("PKG_NAME=$pkg", "PKG_VERSION=$ver", "PKG_SHA256=$sha") |
        Out-File -Encoding ascii 'package.env'
  artifacts:
    reports:
      dotenv: package.env

release:github:
  needs: [package:windows]
